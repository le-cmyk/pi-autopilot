# Pi State File — tracks critical services and resources
# Updated by pi-reboot-debug and pi-health-monitor skills
# Read by agents to know what's important on this machine

hostname: pi
model: Raspberry Pi 5 Model B Rev 1.0
os: Debian GNU/Linux 13 (trixie)
kernel_auto_reboot: true  # kernel.panic=10 + systemd watchdog (60s)

# Storage — PNY CS1030 500GB NVMe SSD
storage:
  device: /dev/nvme0
  partition: /dev/nvme0n1p2 (ext4, 469G)
  boot: /dev/nvme0n1p1 (vfat, 505M)
  model: PNY CS1030 500GB SSD
  smart: PASSED
  available_spare: 100%
  percentage_used: 4%
  unsafe_shutdowns_warning: true  # 59/86 = 68.6% — catastrophic, hard freezes

# WiFi — Broadcom BCM4345/6 SDIO
# CRITICAL: Old firmware (Aug 2023) has known SDIO bus hang bugs → full system freeze
# Updated to 2026-05-19 via firmware-brcm80211 (apt)
wifi:
  chipset: BCM4345/6 (brcmfmac, SDIO)
  firmware_package: firmware-brcm80211 1:20260519-1~bpo13+1+rpt1
  firmware_built: Aug 29 2023 (on-chip ROM, not updatable via package)
  power_save: off  # MUST stay off — primary freeze cause on Pi 5
  frequency: 5GHz
  known_issue: "brcmfmac SDIO firmware (on-chip) is old (Aug 2023). Cannot be updated beyond what Broadcom burned into ROM. If SDIO bus hangs persist, try 2.4GHz band or external USB WiFi adapter."

# NVMe ASPM — DISABLED via cmdline to prevent PCIe bus freezes
# pcie_aspm=off + nvme_core.default_ps_max_latency_us=0
nvme_aspm:
  status: disabled  # set via /boot/firmware/cmdline.txt
  reason: "Pi 5 PCIe controller does not handle NVMe ASPM state transitions reliably"

# Network (WiFi only — eth0 is DOWN)
network:
  interface: wlan0
  ip: 192.168.0.24/24
  gateway: 192.168.0.1
  dns:
    - 89.2.0.1
    - 89.2.0.2
  recovery:
    step_1: "sudo nmcli device connect wlan0"
    step_2: "sudo systemctl restart NetworkManager"
    step_3: "sudo ip link set wlan0 down && sleep 2 && sudo ip link set wlan0 up"
    step_4: "sudo reboot  # last resort if WiFi hardware hung"

# Critical services — must be running after every boot
critical_services:
  - ssh.service
  - docker.service
  - containerd.service
  - cron.service
  - NetworkManager.service
  - systemd-timesyncd.service
  - hermes-gateway.service

# Important but non-critical
optional_services:
  - lightdm.service
  - bluetooth.service
  - avahi-daemon.service

# Hermes
hermes:
  version: "0.19.0"
  home: /home/pi/.hermes
  install: /home/pi/.hermes/hermes-agent (git)
  gateway:
    managed: systemd  # systemd hermes-gateway.service with Restart=always
    service: hermes-gateway.service
    restart_policy: always
    restart_sec: 5
    crash_threshold: 5        # reboot Pi + alert after this many crashes in 10-min window
    crash_window_sec: 600     # 10 minute crash window
    max_reboots: 3            # max reboots in reboot_window before fallback to alert-only
    reboot_window_sec: 1800   # 30 minute reboot window
    crash_log: /var/tmp/hermes-crash.log
    crash_handler: /home/pi/.hermes/scripts/hermes-crash-handler.sh
  cron_jobs:
    - "5adf1051a9c0: Briefing matinal 8h (0 8 * * *)"
    - "cc2b4da77538: Pi Health Monitor (every 10 min)"
  critical_files:
    - config.yaml
    - auth.json
    - .env
    - pi-state.yaml
  backup_dir: /home/pi/.hermes/backups
  backup_manifest: /home/pi/.hermes/backups/critical-files.sha256

# Health thresholds — comprehensive, catches everything before it becomes a freeze
thresholds:
  # Temperature
  temp_warn: 75
  temp_alert: 80
  temp_critical: 85
  # Memory (free RAM, MB)
  mem_free_min_mb: 200
  mem_critical_mb: 100
  # Swap — if swap usage is rising, memory pressure is building toward OOM
  swap_used_warn_mb: 512       # swap creeping up = memory pressure
  swap_used_alert_mb: 1024     # heavy swap = OOM imminent
  swap_used_critical_mb: 1800  # swap nearly full (2GB total)
  # Disk
  disk_warn_pct: 85
  disk_alert_pct: 90
  disk_critical_pct: 95
  # NVMe SMART
  nvme_spare_min_pct: 10       # alert if spare blocks drop below 10%
  nvme_media_errors_max: 0     # any media error = alert
  unsafe_shutdowns_increase: 1  # alert if count increases
  # Load average (1-min, relative to 4 cores)
  load_warn: 3.0               # 75% of 4 cores — system under load
  load_alert: 4.5              # over 100% of cores — processes waiting
  load_critical: 8.0           # 2x cores — system severely overloaded
  # I/O wait — high iowait = NVMe or SD card blocking everything
  iowait_warn: 10              # 10% of CPU time waiting on I/O
  iowait_alert: 25             # 25% — severe I/O bottleneck
  iowait_critical: 50          # 50% — I/O is freezing the system
  # D-state processes (uninterruptible sleep) — stuck waiting on kernel I/O
  d_state_warn: 3              # a few processes stuck in D state
  d_state_alert: 10            # many — likely I/O hang
  d_state_critical: 20         # system-wide I/O stall
  # Zombie processes — leaked children, can exhaust PID space
  zombie_warn: 10
  zombie_alert: 50
  zombie_critical: 200
  # GPU memory — if too high, can cause display freezes
  gpu_mem_warn_mb: 128
  gpu_mem_alert_mb: 256
  # Process count — runaway fork bombs or leaks
  proc_count_warn: 400
  proc_count_alert: 800
  # Open file descriptors (system-wide) — fd leaks can cause "too many open files"
  fd_count_warn: 50000
  fd_count_alert: 100000
  # Filesystem inode usage
  inode_warn_pct: 85
  inode_alert_pct: 95
  # PMIC firmware errors — 1-5 per boot is normal Pi 5 behavior with updated EEPROM
  # Alert only on accumulation (storm): old firmware had 1261/6min
  pmic_warn: 10
  pmic_alert: 100

# Health monitor runtime state — ALL FILES ON NVMe (SURVIVE POWER LOSS)
# /var/tmp is on /dev/nvme0n1p2 (ext4, NOT tmpfs) — confirmed 2026-08-01
# This means: heartbeat, health state, crash logs, pending reports ALL persist across unplugs.
health_state_file: /var/tmp/pi-health-state.json
health_pending_reports: /var/tmp/pi-health-pending-reports.txt

# Data survivability — everything that survives a power cut
survivability:
  journal: persistent  # /var/log/journal on NVMe, survives unplug
  state_files: /var/tmp on NVMe (NOT tmpfs) — all monitoring data persists
  freeze_evidence:
    - /var/tmp/pi-freeze-heartbeat.txt     # survives unplug
    - /var/tmp/pi-freeze-pre-dump.txt      # pre-freeze snapshot survives unplug
    - /var/tmp/pi-freeze-history.log       # detection history survives
    - /var/tmp/pi-last-forensics.txt       # forensic report survives
  crash_evidence:
    - /var/tmp/hermes-crash.log            # survives unplug
    - /var/tmp/hermes-crash-count.txt      # survives unplug
  filesystem_protection:
    - errors=remount-ro                    # prevents cascade corruption
    - commit=5                             # faster journal flush (less data loss window)
    - fsck.mode=force                      # forced fsck on every boot
    - fsck.repair=yes                      # auto-repair on boot
    - tune2fs -c 5                         # force fsck every 5 mounts

# Freeze Detection
# Hard freezes (no kernel panic, no logs) detected via filesystem heartbeat
freeze_detection:
  enabled: true
  heartbeat_script: /home/pi/.hermes/scripts/pi-freeze-watchdog.sh
  forensics_script: /home/pi/.hermes/scripts/pi-freeze-forensics.sh
  cron_job: af11e1e30d9e  # runs every 1 min (pi-freeze-watchdog.sh heartbeat)
  heartbeat_file: /var/tmp/pi-freeze-heartbeat.txt
  pre_dump_file: /var/tmp/pi-freeze-pre-dump.txt
  history_file: /var/tmp/pi-freeze-history.log
  forensics_output: /var/tmp/pi-last-forensics.txt
  stale_threshold_sec: 120  # heartbeat older than this = hard freeze
  check_on_boot: true  # pi-reboot-debug now checks heartbeat staleness

# Known issues & fixes
known_issues:
  - symptom: "Pi freezes, requires hard power cycle (unplug). Black screen, no SSH."
    likely_causes:
      - "WiFi power save ON (check: iwconfig wlan0 | grep Power)"
      - "brcmfmac SDIO firmware bug (on-chip firmware Aug 2023 → SDIO bus hang)"
      - "Kernel/driver bug (check: dmesg | tail -50)"
      - "PMIC firmware error storm (check: dmesg | grep -c 'status 0x80000001')"
      - "NVMe ASPM power management (DISABLED via cmdline: pcie_aspm=off)"
    checks:
      - "sudo journalctl -p err -b -1 --no-pager | tail -30"
      - "vcgencmd get_throttled"
      - "dmesg | grep -iE 'under-voltage|thermal|nvme'"
      - "bash /home/pi/.hermes/scripts/pi-freeze-watchdog.sh check  # detects hard freeze"
      - "bash /home/pi/.hermes/scripts/pi-freeze-forensics.sh  # full forensic report"
    prevention:
      - "WiFi powersave OFF (confirmed)"
      - "brcmfmac firmware package updated to 2026-05-19 (latest available)"
      - "NVMe ASPM DISABLED via cmdline (pcie_aspm=off + nvme_core.default_ps_max_latency_us=0)"
      - "Freeze heartbeat: every 1 min to /var/tmp — detects hard freezes on next boot"
      - "Filesystem: errors=remount-ro prevents cascading corruption"
      - "fstab: commit=5 for faster journal flush"
      - "fsck.mode=force on every boot"
      - "tune2fs -c 5: force fsck every 5 mounts"
      - "Hardware watchdog: 60s timeout (systemd)"
    recovery: "After hard power cycle, let fsck run. Run freeze forensics: bash /home/pi/.hermes/scripts/pi-freeze-forensics.sh. If Hermes fails: restore from ~/.hermes/backups/"

  - symptom: "Pi freezes with no log trace (silent hard freeze) — detected by stale freeze heartbeat"
    root_cause: "Likely brcmfmac SDIO firmware hang OR NVMe ASPM hang. Both cause bus-level lockup that prevents kernel from logging."
    detection: "Freeze watchdog checks heartbeat staleness on boot. Run: bash /home/pi/.hermes/scripts/pi-freeze-watchdog.sh check"
    forensics: "bash /home/pi/.hermes/scripts/pi-freeze-forensics.sh  # full report with pre-freeze snapshot"
    escalation: "If freezes persist after ASPM disable + firmware update → try 2.4GHz WiFi band, disable WiFi entirely (use Ethernet), or use external USB WiFi adapter."

  - symptom: "Hermes fails to start: OSError [Errno 5] Input/output error on config/pairing files"
    root_cause: "Filesystem corruption from hard power cycles (unplugging Pi). EXT4 journal recovers but some files may be lost."
    prevention: "Never unplug the Pi. Use ~/reboot for clean reboots. Backup snapshots every 30 min."
    fix: "Restore from latest backup: cp ~/.hermes/backups/<file>.bak ~/.hermes/<path>. If file is telegram-approved.json, Hermes will auto-regenerate on next gateway start."
    escalation: "If multiple files corrupted: restore from snapshot: tar xzf ~/.hermes/backups/snapshots/hermes-backup-*.tar.gz -C ~/.hermes/"

  - symptom: "Docker containers not starting"
    fix: "sudo systemctl restart docker"

  - symptom: "WiFi disconnected / network down"
    recovery:
      - "sudo nmcli device connect wlan0"
      - "sudo systemctl restart NetworkManager"
      - "sudo ip link set wlan0 down && sleep 2 && sudo ip link set wlan0 up"

  - symptom: "Overheating (temp > 80°C)"
    mitigation:
      - "docker stop <heavy containers>"
      - "Check fan is working"
      - "Reduce cron job frequency temporarily"

  - symptom: "NVMe SMART errors or spare blocks dropping"
    action: "Immediate Telegram alert + suggest filesystem check"